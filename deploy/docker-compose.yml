# 正式部署：PostgreSQL + 遊戲伺服器 + Caddy（自動 HTTPS / wss）
# 使用方式見 docs/deploy.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roe
      POSTGRES_USER: roe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roe -d roe"]
      interval: 5s
      timeout: 5s
      retries: 10

  game:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://roe:${POSTGRES_PASSWORD}@db:5432/roe
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_APP_ID: ${STEAM_APP_ID:-480}
      ALLOW_PASSWORD_LOGIN: ${ALLOW_PASSWORD_LOGIN:-1}
      MARKET_BOTS: ${MARKET_BOTS:-1}
      TRUST_PROXY: "1"
    # 給伺服器時間把所有玩家存檔完再關閉
    stop_grace_period: 30s
    expose:
      - "8787"
    volumes:
      - webclient:/app/public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?請在 .env 設定 DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - webclient:/srv/web:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
  webclient:
